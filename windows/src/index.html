<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSHNotch</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="island" class="island" data-mode="compact" data-expanded="0" data-live="0" data-status="" data-glow="1" data-pinned="0">
    <div class="island-clip">
      <div class="band" aria-hidden="true"></div>
      <div id="island-body" class="island-body">
        <div id="compact" class="compact">
          <span id="c-dot" class="dot" aria-hidden="true"></span>
          <span id="c-title" class="title"><span id="c-title-text" class="title-text">暂无会话</span></span>
          <span id="c-chip" class="chip is-off"></span>
        </div>
        <div id="hud" class="hud">
          <div id="list" class="list" aria-label="会话列表"></div>
          <div id="empty" class="empty"></div>
          <div id="nudges" class="nudges" role="group" aria-label="普通提醒"></div>
          <div class="footer">
            <span id="h-hint" class="hint" role="status"></span>
            <button id="settings-link" class="link" type="button" data-act="settings">设置</button>
          </div>
        </div>
      </div>
    </div>
    <div id="urgent-island" class="urgent-island is-off">
      <button id="urgent-jump" class="urgent-jump" type="button" aria-label="跳转到需要关注的会话">
        <span id="urgent-kind" class="urgent-kind"></span>
        <span id="urgent-label" class="urgent-label"></span>
        <span id="urgent-more" class="urgent-more"></span>
      </button>
      <button id="urgent-close" class="urgent-close" type="button" aria-label="关闭当前提醒展示" title="关闭当前提醒展示">×</button>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
